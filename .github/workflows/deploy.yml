name: Deploy Angular Project

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build Angular
        run: ng build --configuration production
      - name: Add .nojekyll
        run: touch dist/booking-frontend/.nojekyll
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/booking-frontend
          clean: true
          commit-message: "Deploy new Angular project 🚀"
